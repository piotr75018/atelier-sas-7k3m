<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sas d'usinage</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
  "client-zip": "./vendor/client-zip.js"
} }
</script>
<script>
  // Si le module ne demarre pas, on le dit au lieu de rester sur "Chargement..."
  function sasPanne(msg) {
    var el = document.getElementById("sous-titre");
    if (el && /Chargement/.test(el.textContent)) {
      el.innerHTML = "<b style='color:#b00'>La page n'a pas pu démarrer</b> : " + msg +
        ". Rechargez (Ctrl+F5) ; si cela persiste, essayez un autre navigateur (Chrome, Firefox, Edge récents).";
    }
  }
  window.addEventListener("error", function (e) { sasPanne(e.message || "erreur de chargement d'un script"); }, true);
  window.addEventListener("unhandledrejection", function (e) { sasPanne(String(e.reason && e.reason.message || e.reason)); });
  if (!(HTMLScriptElement.supports && HTMLScriptElement.supports("importmap")))
    window.addEventListener("DOMContentLoaded", function () { sasPanne("navigateur trop ancien"); });
  if (location.protocol === "file:")
    window.addEventListener("DOMContentLoaded", function () {
      sasPanne("ce fichier est ouvert directement depuis le disque (file://), ce que les navigateurs bloquent. " +
        "Ouvrez le lien en ligne (lien.txt) ou lancez <code>python sas.py --serve</code>");
    });
  setTimeout(function () { sasPanne("délai dépassé (réseau lent ou bloqué)"); }, 30000);
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="titre">Sas d'usinage</h1>
    <p id="sous-titre" class="muted">Chargement…</p>
  </div>
  <div id="roles" class="seg big" role="group" aria-label="Je suis">
    <button data-r="cnc">Usinage CNC</button>
    <button data-r="eb">Ébénisterie</button>
  </div>
  <div class="dl-all" id="dl-all">
    <div id="fin" class="seg" role="group" aria-label="Finition"></div>
    <button id="zip-btn" class="btn primary" disabled>Télécharger les STL</button>
  </div>
</header>

<div class="layout">
  <nav id="nav" class="nav" aria-label="Pièces"></nav>
  <main class="main">
    <section class="viewer-wrap">
      <canvas id="viewer"></canvas>
      <div id="viewer-msg" class="viewer-msg"></div>
      <div class="viewer-hint muted">Tourner : glisser · Zoom : molette · Déplacer : clic droit · Cliquez une pièce pour l'ouvrir</div>
    </section>
    <section id="panel" class="panel"></section>
  </main>
</div>

<div id="status" class="status" hidden></div>
<script type="module" src="app.js?v=20261016191307"></script>
</body>
</html>
